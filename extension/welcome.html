<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="welcomeTitle">Tab Recorder</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body {
      width: auto;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 28px;
    }
    .card header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .card header img { width: 40px; height: 40px; }
    h1 { font-size: 20px; margin: 0; }
    p { margin: 0 0 12px; color: #d4d4d8; }
    .muted { color: #a1a1aa; font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 12px; }
    .actions .btn { font-size: 14px; padding: 10px 16px; }
    .btn-settings { background: #374151; color: #fff; }
    .btn-settings:hover { background: #4b5563; }
    .mic-status {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .mic-status.granted { background: #052e16; border: 1px solid #166534; color: #86efac; }
    .mic-status.denied, .mic-status.error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
    .mic-status.prompt { background: #422006; border: 1px solid #78350f; color: #fcd34d; }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <img src="logo.png" data-i18n-alt="extName" alt="Tab Recorder">
      <h1 data-i18n="welcomeTitle"></h1>
    </header>
    <p data-i18n="welcomeIntro"></p>
    <p data-i18n="welcomeOnce"></p>
    <div class="actions">
      <button type="button" class="btn btn-record" id="btnEnableMic" data-i18n="btnEnableMic"></button>
      <button type="button" class="btn btn-settings" id="btnOpenSettings" data-i18n="btnOpenSettings" hidden></button>
    </div>
    <div class="mic-status" id="micStatus" role="status" hidden></div>
    <p class="muted" data-i18n="welcomeSkip"></p>
  </main>
  <script src="common.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
