<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extName">Tab Recorder</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { padding: 10px; }
    .bar { gap: 6px; }
    .bar .btn { padding: 6px 9px; }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .row label { min-width: 52px; color: #a1a1aa; }
    .row input, .row select {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      background: #27272a;
      color: #e4e4e7;
      font-size: 12px;
    }
    .row .check {
      flex: 1;
      display: flex;
      gap: 6px;
      align-items: center;
      color: #e4e4e7;
      cursor: pointer;
    }
    .row .check input { flex: none; margin: 0; }
    .status { margin-top: 10px; }
    .footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #3f3f46;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="bar">
    <button type="button" class="btn btn-record" id="btnRecord" data-i18n="btnRecord" data-i18n-title="btnRecordTitle"></button>
    <button type="button" class="btn btn-pause" id="btnPause" data-i18n="btnPause" data-i18n-title="btnPauseTitle" disabled></button>
    <button type="button" class="btn btn-stop" id="btnStop" data-i18n="btnStop" data-i18n-title="btnStopTitle" disabled></button>
    <button type="button" class="btn btn-audio" id="btnAudio" data-i18n="btnAudio" data-i18n-title="btnAudioTitle" disabled></button>
    <button type="button" class="btn btn-mic" id="btnMic" data-i18n="btnMic" data-i18n-title="btnMicTitle" disabled></button>
  </div>
  <div class="row">
    <label for="folder" data-i18n="labelFolder"></label>
    <input type="text" id="folder" placeholder="Recordings/Video/" value="Recordings">
  </div>
  <div class="row">
    <label for="filename" data-i18n="labelFile"></label>
    <input type="text" id="filename" placeholder="tab-2026-02-28-0900.webm" value="">
  </div>
  <div class="row">
    <label for="recordMode" data-i18n="labelMode"></label>
    <select id="recordMode" data-i18n-title="modeTitle">
      <option value="video" data-i18n="modeVideo"></option>
      <option value="audio" data-i18n="modeAudio"></option>
    </select>
  </div>
  <div class="row">
    <label for="includeMic" data-i18n="labelMic"></label>
    <label class="check"><input type="checkbox" id="includeMic"> <span data-i18n="micInclude"></span></label>
  </div>
  <div class="note" id="micSetup" hidden>
    <span data-i18n="micNeedsSetup"></span>
    <a href="#" id="linkMicSetup" data-i18n="btnEnableMic"></a>
  </div>
  <div class="status status-idle" id="status">
    <span id="statusText" data-i18n="statusIdle"></span>
    <span class="timer" id="timer">00:00</span>
  </div>
  <div class="note" id="micNote" data-i18n="micUnavailable" hidden></div>
  <div class="message" id="message" role="alert" hidden></div>
  <div class="footer">
    <a href="#" id="linkRecorderPage" data-i18n="linkRecorderPage" data-i18n-title="linkRecorderPageTitle"></a>
    <a href="#" id="linkWelcome" data-i18n="linkMicSettings" data-i18n-title="linkMicSettingsTitle"></a>
  </div>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
