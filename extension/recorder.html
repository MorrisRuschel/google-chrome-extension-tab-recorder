<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="recorderTitle">Tab Recorder</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { padding: 12px; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #3f3f46;
    }
    .header img { height: 32px; width: auto; display: block; }
    .alert {
      background: #422006;
      color: #fcd34d;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      border: 1px solid #78350f;
    }
    .status { margin-bottom: 14px; }
    .mic-note { margin: -6px 0 14px; }
    .unsaved { margin: -6px 0 14px; }
    .unsaved .bar { margin: 8px 0 0; }
    .unsaved .btn { background: #7f1d1d; color: #fff; }
    .unsaved .btn:hover:not(:disabled) { background: #991b1b; }
    .history-title {
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-title button {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    .history-title button:hover { background: #27272a; color: #e4e4e7; }
    .history-list {
      background: #27272a;
      border-radius: 6px;
      padding: 6px 0;
      max-height: 140px;
      overflow-y: auto;
    }
    .history-item {
      padding: 6px 10px;
      font-size: 11px;
      color: #a1a1aa;
      border-bottom: 1px solid #3f3f46;
      word-break: break-all;
    }
    .history-item:last-child { border-bottom: none; }
    .history-empty { padding: 12px; color: #71717a; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png" data-i18n-alt="extName" alt="Tab Recorder">
    <a href="https://github.com/MorrisRuschel/google-chrome-extension-tab-recorder" target="_blank" rel="noopener">GitHub →</a>
  </div>
  <div class="alert" role="alert" data-i18n="recorderAlert"></div>
  <div class="bar">
    <button type="button" class="btn btn-pause" id="btnPause" data-i18n="btnPause" data-i18n-title="btnPauseTitle" disabled></button>
    <button type="button" class="btn btn-stop" id="btnStop" data-i18n="btnStop" data-i18n-title="btnStopTitle" disabled></button>
    <button type="button" class="btn btn-audio" id="btnAudio" data-i18n="btnAudio" data-i18n-title="btnAudioTitle" disabled></button>
    <button type="button" class="btn btn-mic" id="btnMic" data-i18n="btnMic" data-i18n-title="btnMicTitle" disabled></button>
  </div>
  <div class="status status-idle" id="status">
    <span id="statusText" data-i18n="statusIdle"></span>
    <span class="timer" id="timer">00:00</span>
  </div>
  <div class="note mic-note" id="micNote" data-i18n="micUnavailable" hidden></div>
  <div class="message unsaved" id="unsaved" role="alert" hidden>
    <span data-i18n="unsavedMessage"></span>
    <div class="bar">
      <button type="button" class="btn" id="btnRetrySave" data-i18n="btnRetrySave"></button>
      <button type="button" class="btn" id="btnDiscard" data-i18n="btnDiscard"></button>
    </div>
  </div>
  <div class="history-title">
    <span data-i18n="historyTitle"></span>
    <button type="button" id="btnClearHistory" data-i18n="historyClear"></button>
  </div>
  <div class="history-list" id="historyList">
    <div class="history-empty" id="historyEmpty" data-i18n="historyEmpty"></div>
  </div>
  <script src="common.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
